          - Built a PoC integrating Azure Communication Services into Trimble Connect, enabling real-time video and chat to enhance on-site collaboration.
          - Delivered live demos to major stakeholders like L&T, driving interest and adoption of autonomous scanning solutions in the Indian construction sector.
